name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: [feature]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the feature
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: A clear description of what you want to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions or features you've considered
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or screenshots about the request
